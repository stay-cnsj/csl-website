name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies with cnpm
        run: npm exec --yes --package=cnpm -- cnpm i --by=npm --registry=https://registry.npmjs.org

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check publication editing safeguards
        run: npm test

      - name: Set repository base URL
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_lower="$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')"
          root_repository="$(printf '%s.github.io' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ "$repository_lower" == "$root_repository" ]]; then
            echo 'NUXT_APP_BASE_URL=/' >> "$GITHUB_ENV"
          else
            echo "NUXT_APP_BASE_URL=/${repository_name}/" >> "$GITHUB_ENV"
          fi

      - name: Generate static website
        run: npm run generate

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
