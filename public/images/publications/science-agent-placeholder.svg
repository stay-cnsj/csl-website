    </g>
    <path d="M72 660H1128" stroke="#d4deda" stroke-width="1"/>
    <text x="72" y="709" fill="#65777b" font-size="28" letter-spacing="2">ILLUSTRATIVE PLACEHOLDER</text>
  </g>
</svg>
